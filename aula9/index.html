<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterbookxd</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
     <h1>Letterbookxd</h1>
    <h2>📚 Menu</h2>
    

    <!-- CLASSE + ID: herda o visual de .card e o ID sobrescreve o que muda -->
    <div class="card" id="semana">
        <h3>Livro da semana</h3>
      <h4>Um cometa na terra dos Moomins</h4>
      <p>Tove Marika Jansson</p>
    </div> 
    <!-- SÓ A CLASSE BASE -->
    <div class="card">
      <h4>Torto Arado</h4>
      <p>Itamar Vieira Junior</p>
    </div>

    <!-- DUAS CLASSES: card + destaque (separadas por espaço) -->
    <div class="card destaque">
        <h3>Livro mais custo beneficio</h3>
      <h4>A Estranha na Cama</h4>
      <p>Raphael Montes</p>
    </div>

    <!-- DUAS CLASSES: card + desatualizado -->
    <div class="card desatualizado">
      <h4>A Biblioteca da Meia-Noite</h4>
      <p>Matt Haig</p>
    </div>
  </main>

</body>
</html>
