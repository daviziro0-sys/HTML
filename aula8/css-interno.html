<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  <style> 
  header {
    background-color: #7f4503;
    
  }
header h1 {
    color: #fff;
    margin: 0;
    padding: 10px;
    font-family:"Montserrat", sans-serif;
    text-align: center;
  }
  header p {
    color: #fff;
    margin: 0;
    padding: 5px;
    font-family:"comic sans ms", sans-serif;
    text-align: center;
  }
body{
   background-color: #f5f5dc;
   margin: 0;
  }
 main {
    PADDING: 20px;
    WIDTH: 400px;
    margin:  auto;
 }
 main h2 {
    text-align: center;
    font-family: Helvetica, sans-serif;
    color: #7f4503;
  }

section{
background-color: #fff;
border: 2px solid #6e3904d1;
padding: 10px;
margin-bottom: 10px;
border-radius: 10px;
}
section h3 {
    margin: 0;
    font-family: "Georgia", sans-serif;
    color: #805d35;
  }
  section p {
    margin: 5px 0 0 0;
    font-family: "Verdana", sans-serif;
    color: #333;
  }
  footer {
    background-color: #7f4503;
    color: #fff;
    text-align: center;
    padding: 10px;
    font-family: "Arial", sans-serif;
  }
  </style>
</head>
<body >

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>
</body>
</html>
